<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliss Garasi Transport</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bliss-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .back-btn { color: #800000; text-decoration: none; font-weight: 600; font-size: 1rem; }
        
        /* Tombol PDF Maroon */
        .btn-pdf { background-color: #800000; color: #ffffff; border-radius: 8px; padding: 12px 20px; font-weight: 600; transition: all 0.3s; border: none; }
        .btn-pdf:hover { background-color: #5e0000; color: #ffffff; }
        
        /* Styling Kotak Foto Mobil */
        .car-card { border: 1px solid #eaeaea; border-radius: 12px; overflow: hidden; margin-bottom: 20px; transition: transform 0.3s; }
        .car-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(128,0,0,0.1); border-color: #800000;}
        .car-img { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>

<div class="bliss-container position-relative pb-5">
    
    <!-- Top Navigation (Tombol Kembali) -->
    <div class="p-3 border-bottom d-flex align-items-center">
        <a href="index.html" class="back-btn d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left fs-5"></i> Kembali ke Menu
        </a>
    </div>

    <!-- Header Content -->
    <div class="p-4 text-center pb-2">
        <h3 class="fw-bold" style="color: #800000;">Bliss Garasi Transport</h3>
        <p class="text-muted small">Layanan Rental Mobil Premium & Terpercaya</p>
        
        <!-- TOMBOL BUKA PDF -->
        <!-- Ganti tanda # di bawah ini dengan link Google Drive PDF kamu -->
        <a href="https://drive.google.com/file/d/13xD9RfAH96s5D76gOLPa04D4JFGRCN3m/view?usp=sharing" target="_blank" class="btn btn-pdf w-100 shadow-sm d-flex justify-content-center align-items-center gap-2 mt-3 mb-4">
            <i class="bi bi-file-earmark-pdf fs-5"></i> Unduh Pricelist (PDF)
        </a>
    </div>

    <!-- Bagian Foto-foto Armada -->
    <div class="px-4">
        <h5 class="fw-bold text-start mb-3" style="color: #333;">Armada Pilihan Kami</h5>
        
        <!-- Foto Mobil 1 -->
        <div class="car-card shadow-sm">
            <!-- Ganti src dengan nama file fotomu, misal: mobil1.jpg -->
            <img src="https://via.placeholder.com/400x200?text=Foto+Mobil+1" class="car-img" alt="Mobil 1">
            <div class="p-3 text-start">
                <h6 class="fw-bold mb-1" style="color: #800000;">Toyota Alphard / Vellfire</h6>
                <p class="text-muted small mb-0">Include Driver + BBM</p>
            </div>
        </div>

        <!-- Foto Mobil 2 -->
        <div class="car-card shadow-sm">
            <!-- Ganti src dengan nama file fotomu, misal: mobil2.jpg -->
            <img src="https://via.placeholder.com/400x200?text=Foto+Mobil+2" class="car-img" alt="Mobil 2">
            <div class="p-3 text-start">
                <h6 class="fw-bold mb-1" style="color: #800000;">Innova Zenix Hybrid</h6>
                <p class="text-muted small mb-0">Nyaman & Irit BBM</p>
            </div>
        </div>
        
        <!-- Silakan copy-paste blok 'Foto Mobil' ke bawah jika fotonya lebih dari 2 -->

    </div>
    <div class="text-center mt-5 pb-4">
            <p class="text-muted mb-0" style="font-size: 0.75rem;">&copy; 2026 awrcreativeblissgroup</p>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
