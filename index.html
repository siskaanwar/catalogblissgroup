<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bliss Group | Ekosistem Properti Terintegrasi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .bliss-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .brand-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        /* Mengubah tema warna menjadi Maroon */
        .text-maroon {
            color: #800000;
        }
        .menu-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            display: block;
            height: 100%;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(128, 0, 0, 0.1); /* Bayangan kemerahan */
            border-color: #800000;
        }
        .menu-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #800000; /* Ikon juga disesuaikan */
        }
        .sticky-cta {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            z-index: 1000;
            padding: 0 20px;
        }
        /* Tombol CTA Maroon */
        .btn-maroon {
            background-color: #800000;
            color: #ffffff;
            border-radius: 50px;
            padding: 12px 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            border: none;
        }
        .btn-maroon:hover {
            background-color: #5e0000; /* Maroon yang lebih gelap saat di-hover */
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="bliss-container position-relative">
    
    <!-- Header Section -->
    <div class="text-center pt-5 pb-4 px-3">
        <img src="logo_bliss.png" alt="Bliss Group Logo" class="brand-logo rounded-circle shadow-sm">
        <h2 class="fw-bold text-maroon mt-2 fs-4">BLISS GROUP</h2>
        <p class="text-muted small mb-0">Holding Company of Bliss Ecosystem</p>
        <div class="d-flex justify-content-center gap-3 mt-2 mb-4">
            <a href="https://www.instagram.com/blissgroupofficial?igsh=YWFrc2xjMGNteGdl&utm_source=qr" target="_blank" class="text-maroon text-decoration-none" style="transition: transform 0.3s; display: inline-block;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
                <i class="bi bi-instagram fs-4"></i>
            </a>
            <a href="https://www.tiktok.com/@blissgroupofficial?is_from_webapp=1&sender_device=pc" target="_blank" class="text-maroon text-decoration-none" style="transition: transform 0.3s; display: inline-block;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
                <i class="bi bi-tiktok fs-4"></i>
            </a>
        </div>
    </div>

    <!-- Grid Menu Section -->
    <div class="container px-4">
        <div class="row g-3">
            <!-- Menu 1 -->
            <div class="col-6">
                <!-- Ganti '#' dengan link tujuan -->
                <a href="villa.html" class="menu-card shadow-sm">
                    <i class="bi bi-house-door menu-icon"></i>
                    <h6 class="fw-bold mb-1 fs-6">Bliss Villa</h6>
                    <small class="text-muted" style="font-size: 0.7rem;">Katalog Hunian Eksklusif</small>
                </a>
            </div>
            <!-- Menu 2 -->
            <div class="col-6">
                <a href="kontraktor.html" class="menu-card shadow-sm">
                    <i class="bi bi-tools menu-icon"></i>
                    <h6 class="fw-bold mb-1 fs-6">Bliss Contractor</h6>
                    <small class="text-muted" style="font-size: 0.7rem;">Jasa Bangun & Renovasi</small>
                </a>
            </div>
            <!-- Menu 3 -->
            <div class="col-6">
                <a href="garasi.html" class="menu-card shadow-sm">
                    <i class="bi bi-person-badge menu-icon"></i>
                    <h6 class="fw-bold mb-1 fs-6">Bliss Garasi Transport</h6>
                    <small class="text-muted" style="font-size: 0.7rem;">Rental Mobil</small>
                </a>
            </div>
            <!-- Menu 4 -->
            <div class="col-6">
                <a href="#" class="menu-card shadow-sm">
                    <i class="bi bi-car-front menu-icon"></i>
                    <h6 class="fw-bold mb-1 fs-6">Bliss Auto Care & Car Leather</h6>
                    <small class="text-muted" style="font-size: 0.7rem;">Perawatan Kendaraan</small>
                </a>
            </div>
        </div>
    </div>

    <!-- Sticky Bottom CTA -->
    <div class="sticky-cta">
        <a href="https://maps.app.goo.gl/dyX7xG4oUZxH8M3DA" target="_blank" class="btn btn-maroon w-100 shadow d-flex justify-content-center align-items-center gap-2">
            <i class="bi bi-geo-alt fs-5"></i> Kunjungi Kantor Kami
        </a>
    </div>
    <div class="text-center mt-5 pb-4">
            <p class="text-muted mb-0" style="font-size: 0.75rem;">&copy; 2026 awrcreativeblissgroup</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
